name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Lint every PHP file
        run: |
          docker run --rm -v "$PWD:/src:ro" php:${{ matrix.php }}-cli sh -c \
            'set -e; for f in $(find /src -name "*.php" -o -name "*.module" | grep -v /vendor/); do php -l "$f" >/dev/null; done; echo ok'
