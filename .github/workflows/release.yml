name: Release

# Push a tag like v1.0.7 to publish a GitHub Release with the installable plugin zip attached.
# Users install that zip through WordPress admin (Plugins > Add New > Upload Plugin).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the release and upload its assets

jobs:
  release:
    name: Build, verify and publish the plugin zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag must match the plugin version
        run: |
          set -euo pipefail
          header="$(sed -n 's/^ \* Version: *//p' kelpgate-malware-scanner.php | head -1 | tr -d '[:space:]')"
          if [ "v$header" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the plugin Version header (v$header)"; exit 1
          fi

      - name: Lint every PHP file on the minimum supported PHP (7.4)
        run: docker run --rm -v "$PWD:/src:ro" php:7.4-cli sh -c 'set -e; for f in $(find /src -name "*.php"); do php -l "$f"; done'

      - name: Build and verify the zip
        run: ./package.sh dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="$(ls dist/kelpgate-malware-scanner-*.zip)"
          # a stable, unversioned asset name so .../releases/latest/download/kelpgate-malware-scanner.zip works
          cp "$zip" dist/kelpgate-malware-scanner.zip
          gh release create "$GITHUB_REF_NAME" "$zip" "$zip.sha256" dist/kelpgate-malware-scanner.zip \
            --title "Kelpgate WordPress Plugin $GITHUB_REF_NAME" \
            --notes "Install: download \`$(basename "$zip")\` from the assets below and upload it in WordPress admin (Plugins > Add New > Upload Plugin). Tested on WordPress 5.8 to 6.9 with PHP 7.4 to 8.4 (see the README for the exact combinations). Do not use the 'Source code' archives. SHA-256 is in the attached \`.sha256\` file."
